[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = [
  "@lovable.dev/vite-tanstack-config",
  "@lovable.dev/mcp-js",
  "@lovable.dev/vite-plugin-dev-server-bridge",
  "@lovable.dev/vite-plugin-hmr-gate",
  # Phase 8E AI Builder — user-approved 2026-08-22. The AWS SDK v3 packages
  # are published by AWS and the 24h guard adds little extra safety for a
  # vendor we already trust at the AWS account level. All transitive
  # @aws-sdk/* packages share the same publishing pipeline.
  "@aws-sdk/client-bedrock",
  "@aws-sdk/token-providers",
]
